# Deploy static site to Cloudflare Pages via Direct Upload (API token).
# Do NOT install the Cloudflare Workers & Pages GitHub App for this repo.
# Manual only — avoids burning Actions minutes on every push to main.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Allowlist only — never upload the git repo, drafts, README, or tooling.
      # (Deploying "." also risks picking up package.json written by wrangler-action.)
      - name: Stage publish tree
        run: |
          rm -rf _publish
          mkdir -p _publish/assets/css
          cp index.html _headers _redirects _publish/
          cp assets/css/site.css _publish/assets/css/
          echo "Publish tree:"
          find _publish -type f | sort

      # Wrangler no longer auto-creates Pages projects on deploy.
      # First run creates getcowoka-com; later runs fail "already exists" — ignore that.
      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create getcowoka-com --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Staged tree — no build step.
          # Project name must be getcowoka-com (CF disallows dots). Public URL is custom domain getcowoka.com.
          command: pages deploy _publish --project-name=getcowoka-com --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
